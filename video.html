<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Vault</title>
  <link rel="icon" type="image/png" href="img/logo.png">
  
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="navbar.css">
  <style>
    :root {
      --sfondo: #17092a;
      --testo-giallo: #fbbf24;
      --testo-verde: #10b880;
      --testo-blu: #06b6d4;
      --testo-rosa: #ec4899;
      --testo: #9b8bbd;
      --sfondo-navbar: #08001a;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Jersey 10", sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, rgba(163, 82, 241, .18), transparent 35%), var(--sfondo);
      color: var(--white);
      overflow-x: hidden;
    }

    main {
      width: min(1100px, 92%);
      margin: 0 auto;
      padding: 48px 0;
      text-align: center;
    }

    h1 {
      font-size: clamp(50px, 8vw, 86px);
      color: var(--testo-giallo);
      margin-bottom: 12px;
      text-shadow: 0 0 15px rgba(251, 191, 36, 0.45);
    }

    p {
      font-size: clamp(24px, 3vw, 34px);
      color: var(--testo-blu);
      margin-bottom: 28px;
    }

    .video-shell {
      border: 2px solid var(--testo-rosa);
      padding: 18px;
      box-shadow: 0 0 18px rgba(236, 72, 153, .35), inset 0 0 14px rgba(236, 72, 153, .12);
      background: rgba(8, 0, 26, .45);
    }

    iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 2px solid var(--testo-giallo);
    }
  </style>
</head>

<body>

  <!-- ═══════════ NAVBAR ═══════════ -->
  <nav class="navbar navbar-expand-md navbar-gamevault">
    <div class="container-fluid px-3 px-md-4">
      <div class="nav-sinistra">
        <img src="img/logo.png" alt="Logo" class="nav-logo">
        <span id="nav-titolo">Game Vault</span>
      </div>
      
      <!-- Pulsante Hamburger per Mobile -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Attiva navigazione">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Link e Sezione Account collassabili -->
      <div class="collapse navbar-collapse" id="navbarNav">
        <div class="nav-destra ms-auto">
          <a id="link-home" href="home.html" class="nav-link-gv">
            <img class="nav-icona" src="img/home.svg" alt="">Home
          </a>
          <a id="link-giochi" href="myGames.html" class="nav-link-gv">
            <img class="nav-icona" src="img/giochi.svg" alt="">My Games
          </a>
          <a id="link-trofei" href="trofei.html" class="nav-link-gv">
            <img class="nav-icona" src="img/trofei.svg" alt="">Trofei
          </a>
          <div class="pos-relativa-account">
            <button id="pulsante-account" class="btn-account" aria-label="Account">
              <img src="img/account.svg" alt="Account">
            </button>
            <div id="box-account">
              <p id="nome-utente-account">Player One</p>
              <button id="btn-uscita">Logout</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <main>
    <h1>Blind Run</h1>
    <p>Hai trovato il contenuto nascosto della sezione trofei.</p>
    <div class="video-shell">
      <iframe src="img/2026-05-27 17-51-32.mkv" title="Video segreto" allowfullscreen></iframe>
    </div>
  </main>

  <div id="gemini-chat" aria-live="polite">
    <div class="testata-chat">
      <span>Gemini Assistant</span>
    </div>
    <div class="corpo-chat">
      <p class="messaggio-chat messaggio-sistema">Clicca sul pulsante Gemini per analizzare i tuoi giochi!</p>
    </div>
  </div>
  <button id="pulsante-ai" aria-label="Apri assistente AI" title="Chiedi a Gemini">
    <img src="img/gemini-logo.png" alt="Gemini AI" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/8/8a/Google_Gemini_logo.svg';">
    Gemini
  </button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="navbar-shared.js"></script>
</body>

</html>
