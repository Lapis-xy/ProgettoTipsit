<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 96 96" role="img" aria-label="Save icon faithful">
  <!-- Rounded green background -->
  <rect x="4" y="4" width="88" height="88" rx="12" ry="12" fill="#00b36b" />

  <!-- Floppy outline (thick white stroke, rounded corners) -->
  <rect x="20" y="18" width="56" height="60" rx="8" ry="8" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Top label/slot (inner shape) -->
  <rect x="32" y="26" width="32" height="14" rx="3" ry="3" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Inner detail: small rounded square (shutter area) bottom-right-ish -->
  <rect x="56" y="52" width="12" height="14" rx="3" ry="3" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Slight inner highlight stroke for crisp look -->
  <rect x="20" y="18" width="56" height="60" rx="8" ry="8" fill="none" stroke="#e6fdf4" stroke-width="0.8" opacity="0.18" />
</svg>
