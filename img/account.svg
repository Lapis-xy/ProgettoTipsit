<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" height="50" preserveAspectRatio="xMidYMid meet">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#050012" />
			<stop offset="100%" stop-color="#0b0520" />
		</linearGradient>
		<linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#7f00ff" />
			<stop offset="50%" stop-color="#ff007f" />
			<stop offset="100%" stop-color="#00f0ff" />
		</linearGradient>
		<radialGradient id="centerGlow" cx="50%" cy="42%" r="50%">
			<stop offset="0%" stop-color="#2b0044" stop-opacity="0.9"/>
			<stop offset="60%" stop-color="#0b0520" stop-opacity="0.4"/>
			<stop offset="100%" stop-color="#0b0520" stop-opacity="0"/>
		</radialGradient>
		<filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
			<feGaussianBlur stdDeviation="3" result="b" />
			<feMerge>
				<feMergeNode in="b"/>
				<feMergeNode in="SourceGraphic"/>
			</feMerge>
		</filter>
		<style>
			<![CDATA[
				svg { shape-rendering: geometricPrecision; }
				.soft { filter: url(#softGlow); }
				.round { stroke-linecap: round; stroke-linejoin: round; }
			]]>
		</style>
	</defs>

	<rect width="512" height="512" fill="url(#bg)" />
