<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Icona utente neon rosa">
  <defs>
    <radialGradient id="bg" cx="30%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#2b0b2a" />
      <stop offset="100%" stop-color="#120517" />
    </radialGradient>
    <filter id="glowPink" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="g" />
      <feMerge>
        <feMergeNode in="g" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="s" />
      <feMerge>
        <feMergeNode in="s" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- background square with rounded corners (transparent allowed) -->
  <rect width="96" height="96" rx="12" ry="12" fill="url(#bg)" />

  <!-- outer neon ring -->
  <rect x="4" y="4" width="88" height="88" rx="10" ry="10" fill="none" stroke="#ff39b3" stroke-width="3" opacity="0.22" filter="url(#glowPink)" />

  <!-- inner panel subtle border -->
  <rect x="8" y="8" width="80" height="80" rx="8" ry="8" fill="none" stroke="#1b0b18" stroke-width="1" />

  <!-- user icon centered -->
  <g transform="translate(48,48)">
    <!-- head -->
    <circle cx="0" cy="-14" r="12" fill="none" stroke="#ff4fb3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)" />

    <!-- shoulders/body (rounded path) -->
    <path d="M -26 18 Q -20 6 -2 6 Q 16 6 26 18" fill="none" stroke="#ff4fb3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)" />

    <!-- inner thinner highlight -->
    <circle cx="0" cy="-14" r="6" fill="#ff66c9" opacity="0.08" />
    <path d="M -20 16 Q -12 8 -2 8 Q 10 8 20 16" fill="#ff66c9" opacity="0.04" />

    <!-- strong inner stroke for crisp arcade look -->
    <circle cx="0" cy="-14" r="12" fill="none" stroke="#ff66c9" stroke-width="1" opacity="0.9" />
  </g>
</svg>
